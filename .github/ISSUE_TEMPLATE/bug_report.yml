name: Bug report
description: Report a reproducible problem using synthetic data only
body:
  - type: markdown
    attributes:
      value: Do not upload real filesystem reports, private paths or credentials. Use synthetic filenames.
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Command, operating system, Python version and a small synthetic directory layout.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
