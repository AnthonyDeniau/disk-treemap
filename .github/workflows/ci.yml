name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run pytest
      - run: uv build
      - run: uv run python scripts/release_artifacts.py
      - run: uv run twine check dist/*
      - name: Install wheel and run outside the checkout
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/wheel-env"
          uv pip install --python "$RUNNER_TEMP/wheel-env" dist/*.whl
          mkdir "$RUNNER_TEMP/synthetic-fixture"
          printf 'synthetic test data' > "$RUNNER_TEMP/synthetic-fixture/example.txt"
          if [ "$RUNNER_OS" = Windows ]; then PY="$RUNNER_TEMP/wheel-env/Scripts/python.exe"; else PY="$RUNNER_TEMP/wheel-env/bin/python"; fi
          cd "$RUNNER_TEMP"
          "$PY" -m disk_treemap synthetic-fixture -o wheel-smoke.html --json
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Verify the committed viewer matches its source
        run: git diff --exit-code -- src/disk_treemap/assets/viewer.html
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: uv run -- npm run test:e2e
      - run: uv run python scripts/check_public.py
